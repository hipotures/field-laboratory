{{ define "main" }}
<h1>Articles</h1>

{{ $pages := where site.RegularPages "Section" "posts" }}

{{ if $pages }}
  <ul>
    {{ range $pages.ByDate.Reverse }}
      <li>
        <a href="{{ .RelPermalink }}">{{ .Title }}</a>
        {{ with .Date }}<span class="meta"> — {{ .Format "2006-01-02" }}</span>{{ end }}
      </li>
    {{ end }}
  </ul>
{{ else }}
  <p>No articles yet.</p>
{{ end }}
{{ end }}
