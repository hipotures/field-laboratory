<!doctype html>
<html lang="{{ .Site.Language.Lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{ if .Title }}{{ .Title }} · {{ end }}{{ .Site.Title }}</title>
  <meta name="description" content="{{ .Site.Params.description }}">
  <style>
    body {
      max-width: 860px;
      margin: 3rem auto;
      padding: 0 1.25rem;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.6;
      color: #222;
      background: #fafafa;
    }
    header {
      margin-bottom: 3rem;
      border-bottom: 1px solid #ddd;
      padding-bottom: 1rem;
    }
    a { color: #0645ad; }
    img { max-width: 100%; height: auto; }
    code, pre {
      background: #eee;
      padding: .15rem .3rem;
      border-radius: .25rem;
    }
    pre {
      padding: 1rem;
      overflow-x: auto;
    }
    .site-title {
      font-size: 2rem;
      font-weight: 700;
      text-decoration: none;
      color: #111;
    }
    .meta {
      color: #666;
      font-size: .95rem;
    }
  </style>
</head>
<body>
  <header>
    <a class="site-title" href="/">{{ .Site.Title }}</a>
    <p>{{ .Site.Params.description }}</p>
  </header>

  <main>
    {{ block "main" . }}{{ end }}
  </main>
</body>
</html>
